<section class="section section--tint" id="data">
  <div class="container">
    <header class="section__head">
      <span class="pill pill--orange">Data</span>
      <h2>Data asli pengguna internet Indonesia</h2>
      <p>24 data tahunan, persentase penduduk yang memakai internet. Kenaikan terbesar terjadi sekitar tahun 2021.</p>
    </header>

    <div class="tiles" id="data-tiles"></div>

    <div class="data-grid">
      <article class="card">
        <h3>Grafik data 2000 sampai 2023</h3>
        <div class="chart" id="chart-data" role="img" aria-label="Grafik data pengguna internet"></div>
      </article>
      <article class="card">
        <h3>Tabel data</h3>
        <div class="table-wrap table-wrap--scroll"><table class="table" id="tabel-data"></table></div>
      </article>
    </div>
  </div>
</section>
